# HyConvKT - Hypergraph Convolutional Neural Networks for Knowledge Tracing
seed: 42
deterministic: true
device: "cuda:0"

data:
  data_dir: "./data/xes3g5m"
  file_name: "train_valid_sequences.csv"
  fold: 0
  seq_len: 200
  min_seq_len: 3

model:
  embedding_dim: 64
  d1: 8
  d2: 8
  num_difficulties: 100
  num_types: 2
  hyperedge_nodes: 6
  kernel_size: [3, 3, 3]
  conv_channels: 32
  dropout: 0.2

training:
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  epochs: 200
  patience: 50
  grad_clip: 1.0

checkpoint:
  save_dir: "./checkpoints"
  model_name: "hyconvkt_best.pth"
  resume: false

ablation:
  innovation_names: ["Hypergraph", "3D-Interaction", "Forgetting"]
  finetune_epochs: 50
